<!DOCTYPE html>
<!-- # TRANG: ĐĂNG NHẬP | HTML: khung nội dung | CSS: css/style.css | JavaScript: js/tai-khoan.js -->
<!-- # lang="vi" cho trình duyệt biết nội dung trang dùng tiếng Việt. -->
<html lang="vi">
<!-- # Phần thiết lập: bảng mã, tên tab, CSS và JavaScript; không phải nội dung thân trang. -->
<head>
  <!-- # UTF-8 giúp tiếng Việt có dấu hiển thị đúng. -->
  <meta charset="UTF-8">
  <!-- # Cho trang lấy đúng chiều rộng thiết bị, cần cho giao diện điện thoại. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kansou giúp bạn khám phá anime, đọc và viết review.">
  <!-- # Tên trang xuất hiện trên tab trình duyệt. -->
  <title>Đăng nhập | Kansou</title>
  <link rel="icon" href="images/favicon.svg">
  <!-- # Nạp CSS dùng chung: màu sắc, font, Grid/Flexbox và responsive. -->
  <link rel="stylesheet" href="css/style.css">
  <!-- # Nạp dữ liệu anime trước; defer đợi HTML đọc xong rồi mới chạy script theo thứ tự. -->
  <script src="js/data.js" defer></script>
  <!-- # Nạp các hàm đọc/ghi localStorage, quản lý người dùng và danh sách đã lưu. -->
  <script src="js/luu-tru.js" defer></script>
  <!-- # Nạp hàm dùng chung: tìm phần tử, menu, tìm kiếm và tạo thẻ poster. -->
  <script src="js/chung.js" defer></script>
  <!-- # Nạp xử lý riêng của Đăng nhập; mở js/tai-khoan.js để học các hàm và sự kiện. -->
  <script src="js/tai-khoan.js" defer></script>
</head>
<!-- # Bắt đầu phần giao diện người xem thấy; class cho phép CSS chọn bố cục phù hợp. -->
<body class="auth-body">
  <a class="skip-link" href="#noi-dung">Đến nội dung chính</a>
  <!-- Thanh điều hướng dùng giống nhau ở 8 trang. -->
  <!-- # Thanh đầu trang chứa logo, điều hướng, tìm kiếm và liên kết tài khoản. -->
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Kansou trang chủ">Ani<span>Kanso</span></a>
    <!-- # Nhóm liên kết chuyển giữa các trang; href là tên tệp HTML cần mở. -->
    <nav id="menu" aria-label="Điều hướng chính">
      <a href="index.html">Trang chủ</a>
      <a href="danh-muc.html">Danh mục</a>
      <a href="review.html">Review</a>
      <a href="da-luu.html">Đã lưu</a>
    </nav>
    <div class="header-actions">
      <button id="nut-tim" class="icon-button" aria-label="Mở tìm kiếm" aria-expanded="false"><img src="images/75ea7.svg" alt=""></button>
      <a id="link-tai-khoan" class="icon-button" href="dang-nhap.html" aria-label="Tài khoản"><img src="images/64455.svg" alt=""></a>
      <button id="nut-menu" class="icon-button mobile-menu" aria-label="Mở menu" aria-expanded="false">☰</button>
    </div>
    <!-- # Form tìm kiếm: name="q" gửi từ khóa sang danh-muc.html?q=...; hidden ẩn lúc đầu. -->
    <form id="tim-kiem" class="search-panel" action="danh-muc.html" hidden>
      <label for="tu-khoa">Tìm anime</label>
      <div><input id="tu-khoa" name="q" type="search" placeholder="Nhập tên anime, tác giả hoặc nhân vật…" autocomplete="off"><button class="button primary">Tìm</button></div>
      <!-- # Vùng có id="goi-y-tim" để JavaScript tìm và cập nhật đúng nội dung. -->
      <div id="goi-y-tim"></div>
    </form>
  </header>
  <!-- # Nội dung chính của trang; id="noi-dung" là đích của liên kết bỏ qua menu. -->
  <main id="noi-dung" class="auth-page"><section class="auth-card"><h1>Đăng nhập</h1>
      <!-- # Form đăng nhập; JavaScript đọc tên/email và mật khẩu để kiểm tra kho trình duyệt. -->
      <form id="form-dang-nhap">
        <div class="auth-field"><label for="tai-khoan">Email hoặc tên đăng nhập</label><div class="input-with-icon"><img src="images/97bbf.svg" alt=""><input id="tai-khoan" name="tai-khoan" type="text" placeholder="Nhập email hoặc tên đăng nhập" required maxlength="100"></div></div>
        <div class="auth-field"><label for="mat-khau">Mật khẩu</label><div class="input-with-icon"><img src="images/b0e44.svg" alt=""><input id="mat-khau" name="mat-khau" type="password" placeholder="Nhập mật khẩu" required minlength="8" maxlength="128" autocomplete="new-password"><button class="icon-button" type="button" onclick="hienMatKhau('mat-khau', this)" aria-label="Hiện mật khẩu" aria-pressed="false"><img src="images/33a1b.svg" alt=""></button></div></div>
        <div class="auth-options"><label><input id="ghi-nho" type="checkbox"> Lưu thông tin đăng nhập</label><button type="button" class="text-button" onclick="document.getElementById('quen-mat-khau').showModal()">Quên mật khẩu?</button></div>
        <p id="loi-dang-nhap" class="form-error" role="alert"></p><button class="button primary" type="submit">Đăng nhập</button>
      </form>
      <div class="auth-divider">hoặc</div><button id="google" type="button" class="button google-button"><img src="images/80ba4.svg" alt="">Tiếp tục với Google</button>      <p class="auth-switch">Chưa có tài khoản? <a href="dang-ky.html">Đăng ký ngay</a></p>
    </section>
    <!-- # Hộp thoại được mở bằng showModal() và đóng bằng close(); id phân biệt từng hộp. -->
    <dialog id="quen-mat-khau"><button class="dialog-close" onclick="document.getElementById('quen-mat-khau').close()" aria-label="Đóng">×</button><h2>Khôi phục mật khẩu</h2><p>Nhập email và mã khôi phục bạn đã lưu khi đăng ký.</p><form id="form-khoi-phuc"><label>Email<input id="email-khoi-phuc" type="email" required></label><label>Mã khôi phục<input id="ma-khoi-phuc" required></label><label>Mật khẩu mới<input id="mat-khau-moi" type="password" minlength="8" required></label><p id="loi-khoi-phuc" class="form-error" role="alert"></p><button class="button primary">Đổi mật khẩu</button></form></dialog>
  </main>

  <!-- # Vùng thông báo nổi; JavaScript đổi chữ và bỏ hidden khi cần thông báo. -->
  <div id="thong-bao" role="status" class="toast" hidden></div>
  <!-- # Hộp thoại được mở bằng showModal() và đóng bằng close(); id phân biệt từng hộp. -->
  <dialog id="hop-thong-tin"><button class="dialog-close" onclick="document.getElementById('hop-thong-tin').close()" aria-label="Đóng">×</button><h2 id="tieu-de-hop"></h2><p id="noi-dung-hop"></p></dialog>
</body>
</html>
